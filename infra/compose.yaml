name: devsecops
services:
  jenkins:
    image: ${JENKINS_IMAGE:?Run lock-tools.sh}
    restart: unless-stopped
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["jenkins_home:/var/jenkins_home"]
    networks: [tools]
  db:
    image: ${POSTGRES_IMAGE:?}
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?}
      POSTGRES_DB: sonar
    volumes: ["sonar_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [tools]
  sonarqube:
    image: ${SONAR_IMAGE:?}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?}
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["sonar_data:/opt/sonarqube/data", "sonar_extensions:/opt/sonarqube/extensions", "sonar_logs:/opt/sonarqube/logs"]
    ulimits:
      nofile: {soft: 131072, hard: 131072}
      nproc: 8192
    networks: [tools]
  registry:
    image: ${REGISTRY_IMAGE:?}
    restart: unless-stopped
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["registry_data:/var/lib/registry"]
    networks: [tools]
  metrics:
    image: ${PYTHON_IMAGE:?}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["python", "/code/metrics.py", "serve", "/state"]
    volumes:
      - ../scripts/metrics.py:/code/metrics.py:ro
      - /opt/devsecops/metrics:/state:ro
    networks: [tools]
  prometheus:
    image: ${PROMETHEUS_IMAGE:?}
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [tools, runtime]
  grafana:
    image: ${GRAFANA_IMAGE:?}
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ../monitoring/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks: [tools]
networks:
  tools: {}
  runtime: {external: true, name: devsecops-runtime}
volumes:
  jenkins_home: {}
  sonar_db: {}
  sonar_data: {}
  sonar_extensions: {}
  sonar_logs: {}
  registry_data: {}
  prometheus_data: {}
  grafana_data: {}
