services:
  app:
    image: ${DEPLOY_IMAGE:?Set a registry digest}
    container_name: ${APP_CONTAINER:?}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    ports: ["127.0.0.1:${APP_PORT:?}:8080", "127.0.0.1:${HEALTH_PORT:?}:8081"]
    networks: [runtime]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
networks:
  runtime: {external: true, name: devsecops-runtime}
